# Every push and pull request: the unit and command-line tests, a build, and the whole page walked in Chromium at
# phone size. The handwriting step is left out here (it downloads a 64 MB model); run it on a computer with
#   node scripts/walk.cjs dist --handwriting
name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # every commit, so the never-list gate can check each one
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      # The never-list gate (never-list/README.md): no personal information in any file, commit or commit message.
      - run: node scripts/never-list.mjs --all --history
      - run: npm test
      - run: npm run build
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: node scripts/walk.cjs dist
